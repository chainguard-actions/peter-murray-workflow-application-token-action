# Tests this action success by the application already being installed on the repository

name: Test Success - repository - installed - with proxy and no_proxy

on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: The name of the branch to checkout for the action
        required: true
        default: main

permissions:
  contents: read

jobs:
  test_no_proxy_ignored:
    runs-on: ubuntu-latest

    #    services:
    #      squid:
    #        image: ubuntu/squid
    #        ports:
    #          - 3128/tcp
    #        volumes:
    #          - '${{ github.workspace }}:/var/log/squid'
    #        options: --dns 8.8.8.8

    env:
      no_proxy: "api.github.com"

    steps:
      - name: Checkout specified branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start Squid Proxy container
        run: |
          mkdir "$GITHUB_WORKSPACE/squid"
          sudo chown proxy:proxy "$GITHUB_WORKSPACE/squid"
          docker run -dit --name squid -p 3128:3128 -v "$GITHUB_WORKSPACE/test/squid.conf:/etc/squid/squid.conf" -v "$GITHUB_WORKSPACE/squid:/var/log/squid" ubuntu/squid:latest
          sleep 10
          docker logs squid
          docker inspect squid
          curl http://localhost:3128

      - name: Use action
        id: use_action
        continue-on-error: true
        uses: ./
        with:
          application_id: ${{ secrets.APPLICATION_ID }}
          application_private_key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          https_proxy: http://localhost:3128

      - name: Show Squid Logs and stop container
        run: |
          docker stop squid
          ls -la "$GITHUB_WORKSPACE/squid"
          sudo cat "$GITHUB_WORKSPACE/squid/access.log"

      - name: Use token to read details
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.use_action.outputs.token }}
          script: |
            const repo = await github.rest.repos.get(context.repo);
            console.log(JSON.stringify(repo, null, 2));

  test_no_proxy_acknowledged:
