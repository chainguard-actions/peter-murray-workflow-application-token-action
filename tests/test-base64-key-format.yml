name: Test base64-encoded private key format validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Generate a real RSA key, base64-encode it, and pass it to the action.
      # The key format should be accepted (base64-encoded PEM), but the credentials
      # will fail at the GitHub API level since this is not a real registered app.
      - name: Generate and base64-encode test RSA private key
        run: |
          openssl genrsa -out /tmp/test-key.pem 2048 2>/dev/null
          B64_KEY=$(base64 -w 0 /tmp/test-key.pem)
          echo "TEST_B64_KEY=$B64_KEY" >> $GITHUB_ENV

      - name: Run action with base64-encoded key (valid format, fake credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "999999999"
          application_private_key: ${{ env.TEST_B64_KEY }}

      - name: Assert action failed at API level (not at key format level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly accepted base64 key format and failed at API authentication level"
