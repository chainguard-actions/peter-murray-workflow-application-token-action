name: Test custom github_api_base_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unreachable custom API base URL (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "123456"
          application_private_key: "this-is-not-a-valid-private-key"
          github_api_base_url: "https://github.invalid/api/v3"

      - name: Assert action failed when using unreachable custom API URL
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable API URL, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with unreachable custom API base URL"
