name: Test github_api_base_url input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Generate a syntactically valid RSA private key for testing purposes.
      # This key is valid in format but not registered as a real GitHub App,
      # so the action should fail when trying to authenticate with the GitHub API.
      - name: Generate test RSA private key
        run: |
          openssl genrsa -out /tmp/test-key.pem 2048 2>/dev/null
          echo "TEST_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run action with github_api_base_url input
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "999999999"
          application_private_key: ${{ env.TEST_PRIVATE_KEY }}
          github_api_base_url: "https://api.github.com"

      - name: Assert action attempted to run with github_api_base_url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the credentials are invalid,
          # but the github_api_base_url input was accepted and passed to the action.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed the github_api_base_url input and failed on invalid credentials"
