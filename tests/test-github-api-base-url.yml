name: Test github_api_base_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "12345"
          application_private_key: "fake-key-for-coverage"
          github_api_base_url: "https://api.github.com"
      - name: Assert action ran (fails gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          echo "token set: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOKEN" ]; then
              echo "FAIL: action succeeded but token output is empty"
              exit 1
            fi
            echo "PASS: got a token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid credentials expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
