name: Test https_proxy input parameter
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with https_proxy input (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "999999"
          application_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA2a2rwplBQLzHPZe5RJr9vHSdM7LXKR6QLHD9RFnGJBFqXMi
            kZBXFBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBb
            MIIEowIBAAKCAQEA2a2rwplBQLzHPZe5RJr9vHSdM7LXKR6QLHD9RFnGJBFqXMi
            kZBXFBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBb
            MIIEowIBAAKCAQEA2a2rwplBQLzHPZe5RJr9vHSdM7LXKR6QLHD9RFnGJBFqXMi
            kZBXFBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBb
            -----END RSA PRIVATE KEY-----
          https_proxy: "http://proxy.example.com:3128"
          ignore_environment_proxy: "true"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed, https_proxy input was accepted"
