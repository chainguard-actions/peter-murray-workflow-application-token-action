name: Test https_proxy input with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "999999"
          application_private_key: "not-a-valid-key"
          https_proxy: "http://proxy.example.com:3128"

      - name: Assert action failed gracefully with https_proxy input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials even with https_proxy set, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when https_proxy input is provided"
