name: Test https_proxy input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a self-signed RSA private key for testing
        run: |
          openssl genrsa -out /tmp/test-private-key.pem 2048
          echo "FAKE_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-private-key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        name: Run action with https_proxy set to a non-existent proxy
        uses: .
        continue-on-error: true
        with:
          application_id: "999999999"
          application_private_key: ${{ env.FAKE_PRIVATE_KEY }}
          https_proxy: "http://127.0.0.1:19999"

      - name: Assert action failed (invalid credentials or proxy failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using a non-existent proxy with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when https_proxy is set"

      - name: Assert no token was produced
        env:
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "token present: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ -n "$TOKEN" ]; then
            echo "FAIL: expected no token output when proxy/credentials are invalid"
            exit 1
          fi
          echo "PASS: no token produced as expected"
