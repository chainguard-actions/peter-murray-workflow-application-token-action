name: Test ignore_environment_proxy input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a self-signed RSA private key for testing
        run: |
          openssl genrsa -out /tmp/test-private-key.pem 2048
          echo "FAKE_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test-private-key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        name: Run action with ignore_environment_proxy=true and a fake proxy in env
        uses: .
        continue-on-error: true
        env:
          HTTPS_PROXY: "http://127.0.0.1:9999"
        with:
          application_id: "999999999"
          application_private_key: ${{ env.FAKE_PRIVATE_KEY }}
          ignore_environment_proxy: "true"

      - name: Assert action failed at API call (not proxy connection error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid credentials (API returns 401),
          # NOT because of a proxy connection failure. Either way the step fails,
          # but we confirm the step did fail (not succeed).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid credentials, proxy was ignored)"

      - name: Assert no token was produced
        env:
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "token present: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ -n "$TOKEN" ]; then
            echo "FAIL: expected no token output"
            exit 1
          fi
          echo "PASS: no token produced as expected"
