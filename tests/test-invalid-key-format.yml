name: Test invalid private key format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid key format
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "12345"
          application_private_key: "this-is-not-a-valid-pem-key"

      - name: Assert action failed with invalid key format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid key format, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid private key format"
