name: Test malformed private key error handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with malformed private key
        uses: .
        continue-on-error: true
        with:
          application_id: "12345"
          application_private_key: "this-is-not-a-valid-private-key"

      - name: Assert action failed with malformed key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with malformed private key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with malformed private key"

      - name: Assert no token was produced
        env:
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "token present: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ -n "$TOKEN" ]; then
            echo "FAIL: expected no token output when private key is malformed"
            exit 1
          fi
          echo "PASS: no token produced as expected"
