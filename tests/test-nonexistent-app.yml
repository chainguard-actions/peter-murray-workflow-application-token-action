name: Test nonexistent GitHub App error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a valid RSA private key for testing
        run: |
          openssl genrsa -out /tmp/test_key.pem 2048 2>/dev/null
          echo "TEST_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use a numeric app ID that is valid format but does not correspond to a real app
          application_id: "1"
          application_private_key: ${{ env.TEST_KEY }}

      - name: Assert action failed for nonexistent app
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for nonexistent app, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for nonexistent/mismatched app"
