name: Test optional parameters are accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with optional parameters (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "999999"
          application_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA2a2rwplBQLzFAKEKEYDATAFORTESTINGPURPOSESONLY1234
            FAKE KEY DATA FOR TESTING PURPOSES ONLY NOT A REAL KEY
            -----END RSA PRIVATE KEY-----
          ignore_environment_proxy: "true"
          revoke_token: "false"

      - name: Assert action failed (not a parameter parsing error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed, optional parameters were accepted"
