---
# Test that the revoke_token input is accepted by the action.
# Uses invalid credentials so the action fails at the API call stage,
# but verifies the action correctly processes the revoke_token input
# without crashing before reaching the API call.

name: Test revoke_token input handling
on:
  workflow_dispatch:

jobs:
  test-revoke-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with revoke_token enabled and invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          application_id: "000001"
          application_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKBgkFpFBMFGaFCMBCk
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKBgkFpFBMFGaFCMBCk
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKBgkFpFBMFGaFCMBCk
            -----END RSA PRIVATE KEY-----
          revoke_token: "true"

      - name: Assert action failed (not succeeded with invalid creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (revoke_token=true path)"
