name: Test token generation with specific permissions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if credentials are available
        id: check-creds
        env:
          APP_ID: ${{ secrets.APPLICATION_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No APPLICATION_ID secret found, skipping credential-dependent test"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Credentials available, will run full test"
          fi

      - id: action
        if: steps.check-creds.outputs.skip == 'false'
        uses: .
        with:
          application_id: ${{ secrets.APPLICATION_ID }}
          application_private_key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          permissions: "contents:read"

      - name: Assert token is non-empty
        if: steps.check-creds.outputs.skip == 'false'
        env:
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "token length: ${#TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "FAIL: expected a non-empty token with scoped permissions"
            exit 1
          fi
          echo "PASS: token with scoped permissions was returned"

      - name: Skip notice
        if: steps.check-creds.outputs.skip == 'true'
        run: |
          echo "SKIP: APPLICATION_ID secret not configured, skipping scoped permissions test"
          echo "This test requires a real GitHub App configured with APPLICATION_ID and APPLICATION_PRIVATE_KEY secrets"
